<style>
  :root{
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0B2419;
    overflow: hidden;
  }
  .frame-wrap{
    position: fixed;
    inset: 0;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100vh;
    height: 100dvh; /* dynamic viewport height, aman untuk browser bar mobile */
    border: 0;
  }
  /* Loading state sederhana, hilang begitu iframe siap */
  .loading{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B2419;
    color: #8FA396;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    letter-spacing: .04em;
    text-transform: uppercase;
    transition: opacity .3s ease;
    z-index: 2;
  }
</style>
</head>
<body>

  <div class="loading" id="loading">Memuat Gerai Land…</div>

  <div class="frame-wrap">
    <iframe
      id="gerai-land-frame"
      src="https://script.google.com/macros/s/AKfycbxQE06RZsEO-0aWuJBHPeuROKPZwMm-Ttj6ts_fPOXcEW_3MhO0U7XDs9yJENts_zelXw/exec"
      title="Gerai Land Mini Soccer Purwokerto"
      loading="eager"
      allow="clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <script>
    // Sembunyikan loading state setelah iframe selesai load.
    var frame = document.getElementById('gerai-land-frame');
    var loading = document.getElementById('loading');
    frame.addEventListener('load', function () {
      loading.style.opacity = '0';
      setTimeout(function () { loading.style.display = 'none'; }, 300);
    });
  </script>

</body>
